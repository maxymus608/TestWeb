<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Магазин</title>
<style>
:root{--bg:#0a0a0a;--card:#141110;--line:#2c2219;--text:#f4efe9;--muted:#a09a92;--accent:#ff6a00;--accent2:#c24d00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:20px}
button{font:inherit;cursor:pointer;color:var(--text)}
.cartbtn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;border-radius:10px;padding:9px 16px;color:#111;font-weight:700}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:0 16px 40px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.item img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:#1d1710;display:grid;place-items:center;font-size:40px}
.body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:600}.desc,.stock{color:var(--muted);font-size:13px}
.price{font-size:20px;font-weight:700;margin-top:auto;color:var(--accent)}
.add{background:var(--accent);color:#111;font-weight:700;border:0;border-radius:10px;padding:10px}
.add:disabled{opacity:.4;cursor:not-allowed}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#0f0d0b;border-left:1px solid var(--line);padding:16px;overflow-y:auto;transform:translateX(100%);transition:transform .25s;z-index:10}
#cart.open{transform:none}
.line{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.ln{flex:1;min-width:0;overflow-wrap:anywhere}
.ctl{display:flex;align-items:center;flex:none}
.qty{min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.line button{flex:none;background:#1a1612;border:1px solid var(--line);border-radius:6px;width:28px;height:28px}
input,textarea{width:100%;margin-top:8px;background:#1a1612;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;font:inherit}
#msg{margin-top:10px;font-size:14px}
.menubtn{background:none;border:1px solid var(--line);border-radius:10px;width:42px;height:40px;font-size:20px}
header h1{flex:1;margin-left:12px}
#mall{display:flex;justify-content:space-between;font-weight:600}
.sub{padding-left:22px;color:var(--muted)}
.sub.on{color:var(--accent);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 12px;color:var(--muted);font-size:14px}
select{background:#1a1612;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px;font:inherit;max-width:60%}
.promos{display:flex;gap:10px;overflow-x:auto;padding:14px 16px 0}
.promo{flex:1 0 240px;background:linear-gradient(135deg,var(--accent2),#1f1005);border:1px solid var(--accent);border-radius:14px;padding:14px 16px;font-weight:600;color:var(--text);text-align:left;cursor:pointer}
#menu-drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,100%);background:#0f0d0b;border-right:1px solid var(--line);padding:16px;overflow-y:auto;transform:translateX(-100%);transition:transform .25s;z-index:10}
#menu-drawer.open{transform:none}
#menu-drawer h3{margin:18px 0 6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:none}
#shade.on{display:block}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px 12px;color:var(--muted);font-size:14px}
select{background:#1a1612;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px;font:inherit}
.mi.sub{padding-left:24px;color:var(--muted)}
.mi.cur{color:var(--text);font-weight:600}
.item{cursor:pointer}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;height:67vh;height:67dvh;background:var(--card);border:1px solid var(--accent);border-bottom:0;border-radius:22px 22px 0 0;z-index:11;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1),height .3s ease;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
#sheet.open{transform:none}
#sheet.tall{height:83vh;height:83dvh}
#grab{padding:12px;cursor:pointer;touch-action:none}
#grab::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#3d2f22;margin:0 auto}
#sheetbody{overflow-y:auto;padding:0 20px 24px;flex:1}
.bigpic{width:100%;height:34vh;aspect-ratio:auto;object-fit:cover;border-radius:14px;margin-bottom:14px}
#sheetbody h2{margin:0 0 4px}
.pcard{background:#1a1612;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.pcard.on{border-color:var(--accent)}
.pcard b{color:var(--accent)}
#sheetbody .pcard .desc{margin:6px 0 0}
#sheetbody .desc{font-size:15px;line-height:1.55;margin:12px 0}
#sheetbody .add{width:100%;padding:14px;margin-top:8px}
#modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92%);max-height:80vh;overflow:auto;background:var(--card);border:1px solid var(--accent);border-radius:16px;padding:22px;z-index:12;display:none;white-space:pre-line;line-height:1.55}
</style>
</head>
<body>
<header><button class="menubtn" id="menu" aria-label="Меню">☰</button><h1 id="shop"></h1><button class="cartbtn" id="open">🛒 Кошик <span id="cnt">0</span></button></header>
<div class="promos" id="promos"></div>

<aside id="menu-drawer">
  <div class="line"><b>Меню</b><button id="mclose" onclick="closeAll()">✕</button></div>
  <h3>Каталог</h3>
  <button class="mi" id="mall">Усі товари <span id="arrow">▸</span></button>
  <div id="mcats" hidden></div>
  <h3>Інформація</h3>
  <button class="mi" data-page="delivery">🚚 Умови доставки</button>
  <button class="mi" data-page="partner">🤝 Співпраця</button>
</aside>
<div id="shade"></div>
<div id="modal"></div>
<div id="sheet"><div id="grab" aria-label="Розгорнути або закрити"></div><div id="sheetbody"></div></div>
<div class="bar"><span id="count"></span>
  <select id="sort" aria-label="Сортування">
    <option value="">Сортування: за замовчуванням</option>
    <option value="asc">Від дешевих до дорогих</option>
    <option value="desc">Від дорогих до дешевих</option>
    <option value="name">За назвою А–Я</option>
    <option value="stock">Спочатку в наявності</option>
  </select>
</div>
<div id="grid">Завантаження…</div>

<aside id="cart">
  <div class="line"><b>Кошик</b><button id="close">✕</button></div>
  <div id="lines"></div>
  <p><b>Разом: <span id="total">0</span></b></p>
  <p id="ship" style="color:var(--muted);font-size:14px"></p>
  <input id="fname" placeholder="Імʼя" maxlength="80">
  <input id="fphone" placeholder="Телефон" maxlength="30" inputmode="tel">
  <textarea id="fcomment" placeholder="Коментар (необовʼязково)" maxlength="300"></textarea>
  <button class="cartbtn" id="send" style="width:100%;margin-top:12px;padding:13px">Оформити замовлення</button>
  <div id="msg"></div>
</aside>

<script>
// ===== НАЛАШТУВАННЯ =====
const CONFIG = {
  api: "ВСТАВТЕ_СЮДИ_URL_З_APPS_SCRIPT",  // https://script.google.com/macros/s/.../exec
  shop: "Мій магазин",
  currency: "₴",
  freeFrom: 800,                  // сума для безкоштовної доставки (перший банер і підказка в кошику)
  promos: [                       // актуальні акції (банер + текст у картці). Це приклади — замініть на свої
    { title: "🔥 Третя рідина в подарунок", text: "Купуєте дві рідини Chaser 10 мл — третя безкоштовно. Діє до кінця місяця." },
    { title: "🎁 −10% на перше замовлення", text: "Скажіть менеджеру, що ви вперше в нас, і отримайте знижку 10%." },
    { title: "🤝 Оптом дешевше", text: "Від 10 одиниць одного товару діють оптові ціни. Деталі — у розділі «Співпраця»." }
  ],
  pages: {                        // тексти з меню; новий рядок — \n
    delivery: { title: "Умови доставки", text: "Опишіть тут умови доставки:\nперевізник, терміни, вартість, оплата." },
    partner:  { title: "Співпраця",      text: "Опишіть тут умови співпраці.\n\nКонтакти: Telegram @ваш_нік, телефон +380…" }
  }
};
// ========================
// Демо-каталог: показується, поки в CONFIG.api не вставлено справжній URL
const DEMO = !/^https:/.test(CONFIG.api);
const DEMO_ITEMS = [
  [1,"Рідина Chaser 10 мл","Chaser 10 мл — Ківі-лимон",150,25],
  [2,"Рідина Chaser 10 мл","Chaser 10 мл — Полуниця",150,18],
  [3,"Рідина Chaser 10 мл","Chaser 10 мл — М'ята",150,30],
  [4,"Рідина Chaser 30 мл","Chaser 30 мл — Ківі-лимон",380,12],
  [5,"Рідина Chaser 30 мл","Chaser 30 мл — Полуниця",380,8],
  [6,"Рідина Chaser 30 мл","Chaser 30 мл — Ментол",380,0],
  [7,"Аксесуари","Випарник",220,15],
  [8,"Аксесуари","Акумулятор 18650",310,6]
].map(([id, category, name, price, stock]) => ({ id, category, name, price, stock, image: "", description: "Приклад опису товару" }));

let items = [], cat = "Усі", cart = {}, sort = "";
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const money = n => Number(n).toLocaleString("uk-UA") + " " + CONFIG.currency;
const byId = id => items.find(i => String(i.id) === String(id));

$("#shop").textContent = CONFIG.shop; document.title = CONFIG.shop;
const promoList = () => [{ title: `🚚 Безкоштовна доставка від ${money(CONFIG.freeFrom)}`, text: `Усі замовлення від ${money(CONFIG.freeFrom)} доставляємо безкоштовно.` }, ...CONFIG.promos];
promoList().forEach((p, i) => { const d = el("button", "promo", p.title); d.onclick = () => openPromos(i); $("#promos").appendChild(d); });

async function load() {
  try { if (DEMO) { if (!items.length) items = DEMO_ITEMS; } else items = await (await fetch(CONFIG.api)).json(); }
  catch (e) { $("#grid").textContent = "Не вдалося завантажити товари"; return; }
  for (const id in cart) { const p = byId(id); if (!p || p.stock < 1) delete cart[id]; else cart[id] = Math.min(cart[id], p.stock); }
  draw();
}

function draw() {
  const cats = ["Усі", ...new Set(items.map(i => i.category).filter(Boolean))];
  if (!cats.includes(cat)) cat = "Усі";
  buildMenu(cats);

  const grid = $("#grid"); grid.innerHTML = "";
  const list = shown(); $("#count").textContent = (cat === "Усі" ? "Усі товари" : cat) + " · " + list.length;
  list.forEach(p => {
    const card = el("div", "item"); card.onclick = () => openSheet(p);
    if (/^https?:/i.test(p.image)) { const im = el("img"); im.src = p.image; im.alt = p.name; im.loading = "lazy"; card.appendChild(im); }
    else card.appendChild(el("div", "ph", "📦"));
    const b = el("div", "body");
    b.append(el("div", "name", p.name), el("div", "desc", p.description || ""),
      el("div", "stock", p.stock > 0 ? "В наявності: " + p.stock : "Немає в наявності"), el("div", "price", money(p.price)));
    const add = el("button", "add", "Додати в кошик");
    add.disabled = !(p.stock > 0) || (cart[p.id] || 0) >= p.stock;
    add.onclick = e => { e.stopPropagation(); addToCart(p, card.firstChild); };
    b.appendChild(add); card.appendChild(b); grid.appendChild(card);
  });
  drawCart();
  if (cur != null && $("#sheet").classList.contains("open")) drawSheet();
}

function shown() {
  const list = items.filter(i => cat === "Усі" || i.category === cat);
  const by = {
    asc: (a, b) => a.price - b.price,
    desc: (a, b) => b.price - a.price,
    name: (a, b) => String(a.name).localeCompare(String(b.name), "uk"),
    stock: (a, b) => (b.stock > 0) - (a.stock > 0)
  }[sort];
  return by ? list.sort(by) : list;
}

function drawCart() {
  const L = $("#lines"); L.innerHTML = ""; let total = 0, n = 0;
  for (const id in cart) {
    const p = byId(id); if (!p) continue;
    total += p.price * cart[id]; n += cart[id];
    const row = el("div", "line"); row.appendChild(el("span", "ln", p.name + " — " + money(p.price)));
    const ctl = el("span", "ctl"); const m = el("button", "", "−"), q = el("span", "qty", String(cart[id])), a = el("button", "", "+");
    m.onclick = () => { if (--cart[id] < 1) delete cart[id]; draw(); };
    a.onclick = () => { if (cart[id] < p.stock) cart[id]++; draw(); };
    ctl.append(m, q, a); row.appendChild(ctl); L.appendChild(row);
  }
  $("#total").textContent = money(total); $("#cnt").textContent = n;
  $("#ship").textContent = total >= CONFIG.freeFrom ? "🚚 Доставка безкоштовна" : "До безкоштовної доставки: " + money(CONFIG.freeFrom - total);
}

function buildMenu(cats) {
  const m = $("#mcats"); m.innerHTML = "";
  cats.forEach(c => {
    const b = el("button", "mi sub" + (c === cat ? " cur" : ""), c === "Усі" ? "Показати все" : c);
    b.onclick = () => { cat = c; closeAll(); draw(); window.scrollTo(0, 0); };
    m.appendChild(b);
  });
}
// "Усі товари" розкриває список підкатегорій
$("#mall").onclick = () => {
  const box = $("#mcats");
  box.hidden = !box.hidden;
  $("#arrow").textContent = box.hidden ? "▸" : "▾";
};
// сортування
$("#sort").onchange = e => { sort = e.target.value; draw(); };
function closeAll() {
  $("#menu-drawer").classList.remove("open");
  $("#modal").style.display = "none";
  $("#sheet").classList.remove("open", "tall");
  $("#shade").classList.remove("on");
}
$("#menu").onclick = () => { $("#menu-drawer").classList.add("open"); $("#shade").classList.add("on"); };
$("#shade").onclick = closeAll;
document.querySelectorAll("[data-page]").forEach(b => b.onclick = () => {
  const p = CONFIG.pages[b.dataset.page];
  $("#modal").textContent = p.title + "\n\n" + p.text;
  $("#modal").style.display = "block";
  $("#menu-drawer").classList.remove("open");
});

// ===== Анімація "політ у кошик" =====
function bump() {
  $("#open").animate([{ transform: "scale(1)" }, { transform: "scale(1.18)" }, { transform: "scale(1)" }], { duration: 320 });
}
function fly(src) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { bump(); return; }
  const a = src.getBoundingClientRect(), t = $("#open").getBoundingClientRect();
  const c = src.cloneNode(true);
  Object.assign(c.style, { position: "fixed", left: a.left + "px", top: a.top + "px", width: a.width + "px", height: a.height + "px",
    margin: 0, zIndex: 20, pointerEvents: "none", borderRadius: "16px", overflow: "hidden", objectFit: "cover", aspectRatio: "auto" });
  document.body.appendChild(c);
  const dx = t.left + t.width / 2 - (a.left + a.width / 2), dy = t.top + t.height / 2 - (a.top + a.height / 2);
  const an = c.animate([
    { transform: "translate(0,0) scale(1)", opacity: 1 },
    { transform: `translate(${dx * 0.55}px,${dy * 0.55 - 60}px) scale(.45)`, opacity: .95, offset: .55 },
    { transform: `translate(${dx}px,${dy}px) scale(.08)`, opacity: .2 }
  ], { duration: 750, easing: "cubic-bezier(.5,0,.75,.4)" });
  an.onfinish = () => { c.remove(); bump(); };
}
function addToCart(p, src) {
  if ((cart[p.id] || 0) >= p.stock) return;
  fly(src);
  cart[p.id] = (cart[p.id] || 0) + 1;
  draw();
}

// ===== Акції в нижній картці =====
function openPromos(i) {
  cur = null;
  const b = $("#sheetbody"); b.innerHTML = "";
  b.appendChild(el("h2", "", "Актуальні акції"));
  promoList().forEach((p, k) => {
    const c = el("div", "pcard" + (k === i ? " on" : ""));
    c.append(el("b", "", p.title), el("p", "desc", p.text));
    b.appendChild(c);
  });
  $("#sheet").classList.remove("tall"); $("#sheet").classList.add("open"); $("#shade").classList.add("on");
}

// ===== Картка товару знизу =====
let cur = null; // id товару, відкритого в картці
function openSheet(p) {
  cur = p.id; drawSheet();
  $("#sheet").classList.remove("tall");
  $("#sheet").classList.add("open");
  $("#shade").classList.add("on");
}
function drawSheet() {
  const p = byId(cur), b = $("#sheetbody");
  if (!p) { closeAll(); return; }
  b.innerHTML = "";
  let pic;
  if (/^https?:/i.test(p.image)) { pic = el("img", "bigpic"); pic.src = p.image; pic.alt = p.name; }
  else pic = el("div", "ph bigpic", "📦");
  const add = el("button", "add", p.stock > 0 ? "Додати в кошик" : "Немає в наявності");
  add.disabled = !(p.stock > 0) || (cart[p.id] || 0) >= p.stock;
  add.onclick = () => addToCart(p, pic);
  b.append(pic, el("h2", "", p.name), el("div", "stock", p.category || ""), el("div", "price", money(p.price)),
    el("div", "stock", p.stock > 0 ? "В наявності: " + p.stock : "Немає в наявності"),
    el("p", "desc", p.description || "Опис відсутній"), add);
}
// ручка: клік — 2/3 ↔ 5/6 екрана; свайп вгору — розгорнути, вниз — згорнути/закрити
{
  const sheet = $("#sheet"), grab = $("#grab"); let y0 = null;
  grab.onclick = () => sheet.classList.toggle("tall");
  grab.ontouchstart = e => { y0 = e.touches[0].clientY; };
  grab.ontouchend = e => {
    if (y0 == null) return;
    const dy = e.changedTouches[0].clientY - y0; y0 = null;
    if (dy < -40) sheet.classList.add("tall");
    else if (dy > 40) { if (sheet.classList.contains("tall")) sheet.classList.remove("tall"); else closeAll(); }
  };
}
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });

$("#open").onclick = () => $("#cart").classList.add("open");
$("#close").onclick = () => $("#cart").classList.remove("open");

$("#send").onclick = async () => {
  const msg = $("#msg"), btn = $("#send");
  if (!Object.keys(cart).length) { msg.textContent = "Кошик порожній"; return; }
  if (DEMO) {
    for (const id in cart) byId(id).stock -= cart[id];
    cart = {}; msg.textContent = "Демо-режим: замовлення не надсилається, залишок змінено лише тут."; load(); return;
  }
  btn.disabled = true; msg.textContent = "Надсилаємо…";
  try {
    const r = await fetch(CONFIG.api, { method: "POST", body: JSON.stringify({
      name: $("#fname").value, phone: $("#fphone").value, comment: $("#fcomment").value,
      lines: Object.entries(cart).map(([id, qty]) => ({ id, qty }))
    }) });
    const d = await r.json();
    if (d.ok) { cart = {}; msg.textContent = "Дякуємо! Замовлення прийнято, ми звʼяжемося з вами."; }
    else msg.textContent = d.error || "Не вдалося оформити";
  } catch (e) { msg.textContent = "Помилка звʼязку, спробуйте ще раз"; }
  btn.disabled = false; load();
};

load();
setInterval(load, 60000); // оновлення залишків раз на хвилину
</script>
</body>
</html>
